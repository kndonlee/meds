<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>airctl</title></head>
<body>
<script>
// Stream Deck HTML plugin (SDK 2) for the local airctl daemon.
//   com.kndonlee.airctl.co2 : live CO2 / temp / AC indicator (press = refresh)
//   com.kndonlee.airctl.ac  : AC on/off (tap = toggle) and AUTO/MANUAL mode (long press, >= LONG_MS)
//   com.kndonlee.airctl.acdown / acup     : AC setpoint ~1F through airctl /control (shows the setpoint)
//   com.kndonlee.airctl.heatdown / heatup : heater setpoint via airctl's /heater relay (no state readback)
// Status JSON: { co2, temp_f, reading_ts, colors, features: { cooling: { on, mode, mode_reason, target_f } } }
const BASE = "http://127.0.0.1:8788";
const LONG_MS = 600;
const pressTimers = new Map();   // AC context -> long-press timer (deleted once it fires)
// The heater's first up/down press only wakes the setpoint (it blinks); later presses within this
// window change it 1F. So a press after a quiet spell sends two (wake + step), otherwise one.
const HEATER_WAKE_MS = 5000;
let heaterLast = 0;
const ARROW = { "com.kndonlee.airctl.acdown": "down", "com.kndonlee.airctl.acup": "up",
                "com.kndonlee.airctl.heatdown": "down", "com.kndonlee.airctl.heatup": "up" };
const POLL_MS = 5000;
const STALE_S = 300;
const FONT = "-apple-system, Helvetica, Arial, sans-serif";

let ws = null;
const keys = new Map();   // context -> action UUID
let last = null;
let lastError = null;
const busy = new Set();   // AC contexts mid-toggle

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function co2Color(v, colors) {
  const [orangeFrom, redFrom] = colors || [1100, 1500];
  if (v >= redFrom) return "#ff3b30";
  if (v >= orangeFrom) return "#ffaa00";
  return "#00dc64";
}

function canvas() {
  const c = document.createElement("canvas");
  c.width = 144; c.height = 144;
  const g = c.getContext("2d");
  g.fillStyle = "#0d1216";
  g.fillRect(0, 0, 144, 144);
  g.textAlign = "center";
  g.textBaseline = "middle";
  return [c, g];
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function drawCO2() {
  const [c, g] = canvas();
  const st = last;
  const now = Date.now() / 1000;
  const stale = !st || !st.reading_ts || now - st.reading_ts > STALE_S;
  g.fillStyle = "#8a98a2";
  g.font = `600 22px ${FONT}`;
  g.fillText("CO₂", 72, 24);
  if (!st || st.co2 == null) {
    g.fillStyle = "#6b7880";
    g.font = `700 48px ${FONT}`;
    g.fillText("--", 72, 74);
    g.font = `500 18px ${FONT}`;
    g.fillText(lastError ? "offline" : "waiting", 72, 120);
  } else {
    g.globalAlpha = stale ? 0.45 : 1;
    g.fillStyle = co2Color(st.co2, st.colors);
    const text = String(st.co2);
    g.font = `800 ${text.length >= 4 ? 50 : 58}px ${FONT}`;
    g.fillText(text, 72, 72);
    g.fillRect(22, 100, 100, 5);
    g.globalAlpha = 1;
    const cooling = st.features && st.features.cooling && st.features.cooling.on;
    g.font = `500 18px ${FONT}`;
    g.fillStyle = "#c7d0d6";
    const temp = st.temp_f != null ? `${Math.round(st.temp_f)}°F` : "";
    if (cooling) {
      g.fillText(temp, 52, 125);
      g.fillStyle = "#1e90ff";
      roundRect(g, 80, 113, 42, 24, 7); g.fill();
      g.fillStyle = "#ffffff";
      g.font = `700 16px ${FONT}`;
      g.fillText("AC", 101, 126);
    } else {
      g.fillText(stale ? "stale" : temp, 72, 125);
    }
  }
  return c.toDataURL("image/png");
}

function drawAC(ctx) {
  const [c, g] = canvas();
  const f = last && last.features && last.features.cooling;
  g.fillStyle = "#8a98a2";
  g.font = `600 22px ${FONT}`;
  g.fillText("AC", 72, 24);
  if (busy.has(ctx)) {
    g.fillStyle = "#c7d0d6";
    g.font = `700 30px ${FONT}`;
    g.fillText("…", 72, 72);
  } else if (!f) {
    g.fillStyle = "#6b7880";
    g.font = `700 40px ${FONT}`;
    g.fillText("--", 72, 72);
    g.font = `500 18px ${FONT}`;
    g.fillText(lastError ? "offline" : "waiting", 72, 120);
  } else {
    const on = !!f.on;
    g.fillStyle = on ? "#1e90ff" : "#2a3238";
    roundRect(g, 22, 46, 100, 52, 14); g.fill();
    g.fillStyle = on ? "#ffffff" : "#8a98a2";
    g.font = `800 34px ${FONT}`;
    g.fillText(on ? "ON" : "OFF", 72, 73);
    g.font = `700 17px ${FONT}`;
    if (f.mode === "manual" && f.mode_reason === "no_sensor") { g.fillStyle = "#ff3b30"; g.fillText("NO SENSOR", 72, 122); }
    else if (f.mode === "manual") { g.fillStyle = "#ff9500"; g.fillText("MANUAL", 72, 122); }
    else { g.font = `500 17px ${FONT}`; g.fillStyle = "#8a98a2"; g.fillText("auto", 72, 122); }
  }
  return c.toDataURL("image/png");
}

function arrow(g, dir, color) {
  g.fillStyle = color;
  g.beginPath();
  if (dir === "up") { g.moveTo(72, 44); g.lineTo(104, 84); g.lineTo(40, 84); }
  else { g.moveTo(40, 52); g.lineTo(104, 52); g.lineTo(72, 92); }
  g.closePath(); g.fill();
}

function drawStep(ctx, action) {
  const [c, g] = canvas();
  const dir = ARROW[action];
  const heater = action.includes(".heat");
  g.fillStyle = "#8a98a2";
  g.font = `600 22px ${FONT}`;
  g.fillText(heater ? "HEAT" : "AC", 72, 24);
  if (busy.has(ctx)) {
    g.fillStyle = "#c7d0d6"; g.font = `700 30px ${FONT}`; g.fillText("…", 72, 72);
    return c.toDataURL("image/png");
  }
  arrow(g, dir, heater ? "#ff7a1a" : "#1e90ff");
  g.font = `500 18px ${FONT}`;
  g.fillStyle = "#c7d0d6";
  if (heater) {
    g.fillText(dir === "up" ? "warmer" : "cooler", 72, 122);
  } else {
    const f = last && last.features && last.features.cooling;
    g.fillText(f && f.target_f != null ? `set ${f.target_f}°F` : (lastError ? "offline" : "--"), 72, 122);
  }
  return c.toDataURL("image/png");
}

function draw() {
  for (const [ctx, action] of keys) {
    const image = ARROW[action] ? drawStep(ctx, action)
      : action === "com.kndonlee.airctl.ac" ? drawAC(ctx) : drawCO2();
    send({ event: "setImage", context: ctx, payload: { image, target: 0 } });
  }
}

async function poll() {
  try {
    const res = await fetch(BASE + "/status", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    last = await res.json();
    lastError = null;
  } catch (e) {
    lastError = String(e);
    last = null;
  }
  draw();
}

async function toggleAC(ctx, query = "set=toggle") {
  if (busy.has(ctx)) return;
  busy.add(ctx); draw();
  try {
    const res = await fetch(`${BASE}/control?feature=cooling&${query}&source=streamdeck`, { cache: "no-store" });
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error || "HTTP " + res.status);
    send({ event: "showOk", context: ctx });
  } catch (e) {
    send({ event: "showAlert", context: ctx });
  } finally {
    busy.delete(ctx);
    poll();
  }
}

async function acStep(ctx, action) {
  if (busy.has(ctx)) return;
  busy.add(ctx); draw();
  try {
    const set = ARROW[action] === "up" ? "temp_up" : "temp_down";
    const res = await fetch(`${BASE}/control?feature=cooling&set=${set}&source=streamdeck`, { cache: "no-store" });
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error || "HTTP " + res.status);
    send({ event: "showOk", context: ctx });
  } catch (e) {
    send({ event: "showAlert", context: ctx });
  } finally {
    busy.delete(ctx);
    poll();
  }
}

async function heaterStep(ctx, action) {
  if (busy.has(ctx)) return;
  const now = Date.now();
  const n = now - heaterLast > HEATER_WAKE_MS ? 2 : 1;
  heaterLast = now;
  busy.add(ctx); draw();
  try {
    const res = await fetch(`${BASE}/heater/press/${ARROW[action]}?n=${n}`, { cache: "no-store" });
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error || "HTTP " + res.status);
    heaterLast = Date.now();
    send({ event: "showOk", context: ctx });
  } catch (e) {
    send({ event: "showAlert", context: ctx });
  } finally {
    busy.delete(ctx);
    draw();
  }
}

// Called by the Stream Deck app when it loads the plugin.
function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo) {
  ws = new WebSocket("ws://127.0.0.1:" + inPort);
  ws.onopen = () => send({ event: inRegisterEvent, uuid: inPluginUUID });
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.event === "willAppear") { keys.set(msg.context, msg.action); draw(); poll(); }
    else if (msg.event === "willDisappear") { keys.delete(msg.context); }
    else if (msg.event === "keyDown" && msg.action === "com.kndonlee.airctl.ac") {
      // Tap toggles on key-up; holding LONG_MS switches AUTO/MANUAL (and never switches the AC).
      const ctx = msg.context;
      clearTimeout(pressTimers.get(ctx));
      pressTimers.set(ctx, setTimeout(() => { pressTimers.delete(ctx); toggleAC(ctx, "mode=toggle"); }, LONG_MS));
    }
    else if (msg.event === "keyUp" && msg.action === "com.kndonlee.airctl.ac") {
      if (pressTimers.has(msg.context)) {
        clearTimeout(pressTimers.get(msg.context));
        pressTimers.delete(msg.context);
        toggleAC(msg.context);
      }
    }
    else if (msg.event === "keyDown") {
      if (msg.action.includes(".heat")) heaterStep(msg.context, msg.action);
      else if (ARROW[msg.action]) acStep(msg.context, msg.action);
      else poll();
    }
  };
  setInterval(poll, POLL_MS);
  poll();
}
</script>
</body>
</html>
