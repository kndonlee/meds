<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>airctl CO2</title></head>
<body>
<script>
// Stream Deck HTML plugin (SDK 2). Polls the local airctl daemon and draws CO2 on each key using it.
// Status JSON: { co2, temp_f, humidity, reading_ts, colors: [orange_from, red_from], features: { cooling: { on } } }
const STATUS_URL = "http://127.0.0.1:8788/status";
const POLL_MS = 5000;
const STALE_S = 300;

let ws = null;
const contexts = new Set();
let last = null;      // last status JSON
let lastError = null;

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function co2Color(v, colors) {
  const [orangeFrom, redFrom] = colors || [1100, 1500];
  if (v >= redFrom) return "#ff3b30";
  if (v >= orangeFrom) return "#ffaa00";
  return "#00dc64";
}

function draw() {
  const c = document.createElement("canvas");
  c.width = 144; c.height = 144;
  const g = c.getContext("2d");
  g.fillStyle = "#0d1216";
  g.fillRect(0, 0, 144, 144);
  g.textAlign = "center";
  g.textBaseline = "middle";

  const st = last;
  const now = Date.now() / 1000;
  const stale = !st || !st.reading_ts || now - st.reading_ts > STALE_S;

  // label
  g.fillStyle = "#8a98a2";
  g.font = "600 22px -apple-system, Helvetica, Arial, sans-serif";
  g.fillText("CO₂", 72, 24);

  if (!st || st.co2 == null) {
    g.fillStyle = "#6b7880";
    g.font = "700 48px -apple-system, Helvetica, Arial, sans-serif";
    g.fillText("--", 72, 74);
    g.font = "500 18px -apple-system, Helvetica, Arial, sans-serif";
    g.fillText(lastError ? "offline" : "waiting", 72, 120);
  } else {
    const color = co2Color(st.co2, st.colors);
    g.globalAlpha = stale ? 0.45 : 1;
    g.fillStyle = color;
    const text = String(st.co2);
    g.font = `800 ${text.length >= 4 ? 50 : 58}px -apple-system, Helvetica, Arial, sans-serif`;
    g.fillText(text, 72, 72);
    // color bar
    g.fillRect(22, 100, 100, 5);
    g.globalAlpha = 1;
    // bottom line: temp + AC indicator
    const cooling = st.features && st.features.cooling && st.features.cooling.on;
    g.font = "500 18px -apple-system, Helvetica, Arial, sans-serif";
    g.fillStyle = "#c7d0d6";
    const temp = st.temp_f != null ? `${Math.round(st.temp_f)}°F` : "";
    if (cooling) {
      g.fillText(temp, 52, 125);
      g.fillStyle = "#1e90ff";
      roundRect(g, 80, 113, 42, 24, 7); g.fill();
      g.fillStyle = "#ffffff";
      g.font = "700 16px -apple-system, Helvetica, Arial, sans-serif";
      g.fillText("AC", 101, 126);
    } else {
      g.fillText(stale ? "stale" : temp, 72, 125);
    }
  }
  const image = c.toDataURL("image/png");
  for (const ctx of contexts) send({ event: "setImage", context: ctx, payload: { image, target: 0 } });
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

async function poll() {
  try {
    const res = await fetch(STATUS_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    last = await res.json();
    lastError = null;
  } catch (e) {
    lastError = String(e);
    last = null;
  }
  draw();
}

// Called by the Stream Deck app when it loads the plugin.
function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo) {
  ws = new WebSocket("ws://127.0.0.1:" + inPort);
  ws.onopen = () => send({ event: inRegisterEvent, uuid: inPluginUUID });
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.event === "willAppear") { contexts.add(msg.context); draw(); poll(); }
    else if (msg.event === "willDisappear") { contexts.delete(msg.context); }
    else if (msg.event === "keyDown") { poll(); }
  };
  setInterval(poll, POLL_MS);
  poll();
}
</script>
</body>
</html>
